<!DOCTYPE html>
<html lang="pt-MZ">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DayTours | Maputo Blue — Experiências em Moçambique</title>
  <meta name="description" content="Explore todos os tours da Maputo Blue: Island DayTrips, Sunset Cruises, Safaris, Transfers e City Tours a partir de Maputo, Moçambique.">

  <meta name="robots" content="index, follow">

  <!-- hreflang -->
  <link rel="alternate" hreflang="pt" href="https://www.maputoblue.com/pages/tours.html">
  <link rel="alternate" hreflang="en" href="https://www.maputoblue.com/en/tours.html">
  <link rel="alternate" hreflang="x-default" href="https://www.maputoblue.com/pages/tours.html">
  <link rel="canonical" href="https://www.maputoblue.com/pages/tours.html">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="DayTours | Maputo Blue">
  <meta property="og:description" content="Todos os tours disponíveis: ilhas, praias, safaris, transfers e city tours.">
  <meta property="og:image" content="../assets/images/hero/hero-4.webp">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="preload" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" as="style">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"></noscript>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="icon" type="image/png" href="../logo.webp">
</head>
<body>

  <!-- Preloader -->
  <script defer src="https://unpkg.com/@lottiefiles/lottie-player@2.0.12/dist/lottie-player.js"></script>
  <div id="preloader" aria-hidden="true">
    <lottie-player src="../assets/preloader/boat steering.json" background="transparent" speed="1" loop autoplay></lottie-player>
  </div>
  <script>(function(){var t=Date.now(),done=false;function hide(){if(done)return;done=true;var p=document.getElementById('preloader');if(p)p.classList.add('hidden');}document.addEventListener('DOMContentLoaded',function(){setTimeout(hide,Math.max(0,600-(Date.now()-t)));});setTimeout(hide,2500);})();</script>

  <div id="navbar-placeholder"></div>

  <main class="tours-main">

    <!-- Page Hero -->
    <header class="page-hero page-hero--tours" aria-labelledby="tours-page-title">
      <div class="mb-container">
        <div class="page-hero-content">
          <nav class="breadcrumb-mb" aria-label="Breadcrumb">
            <a href="../index.html">Home</a>
            <span>/</span>
            <span>DayTours</span>
          </nav>
          <h1 class="page-hero-title" id="tours-page-title">Todos os DayTours</h1>
          <p class="page-hero-subtitle">Escolha a experiência perfeita para si — ilhas, praias, safaris e muito mais</p>
        </div>
      </div>
    </header>

    <!-- Category Filters -->
    <div class="tours-filters" role="navigation" aria-label="Filtrar tours por categoria">
      <div class="mb-container">
        <div class="filter-row">
          <button class="filter-chip active" data-category="all">
            <i class='bx bx-grid-alt'></i> Todos
          </button>
          <button class="filter-chip" data-category="island-daytrips">
            <i class='bx bx-anchor'></i> Island DayTrips
          </button>
          <button class="filter-chip" data-category="beach-daytrips">
            <i class='bx bx-sun'></i> Sunset Cruises
          </button>
          <button class="filter-chip" data-category="safaris">
            <i class='bx bx-landscape'></i> Safaris
          </button>
          <button class="filter-chip" data-category="transfers">
            <i class='bx bx-car'></i> Transfers
          </button>
          <button class="filter-chip" data-category="maputo-city-tour">
            <i class='bx bx-building-house'></i> City Tours
          </button>
          <button class="filter-chip" data-category="whale-watching">
            <i class='bx bxs-binoculars'></i> Whale Watching
          </button>
          <button class="filter-chip" data-category="fishing-charters">
            <i class='bx bxs-ship'></i> Fishing Charters
          </button>
        </div>
      </div>
    </div>

    <!-- Tours Grid -->
    <section class="mb-section" style="background:var(--light-bg);" aria-label="Lista de tours">
      <div class="mb-container">
        <div class="tours-grid" id="tours-grid" aria-live="polite">
          <!-- Populated by data-loader.js -->
          <div class="tour-card"><div class="skeleton" style="height:220px;border-radius:var(--radius-lg) var(--radius-lg) 0 0;"></div><div style="padding:20px;display:flex;flex-direction:column;gap:12px;"><div class="skeleton" style="height:20px;width:80%;border-radius:4px;"></div><div class="skeleton" style="height:14px;width:60%;border-radius:4px;"></div></div></div>
          <div class="tour-card"><div class="skeleton" style="height:220px;border-radius:var(--radius-lg) var(--radius-lg) 0 0;"></div><div style="padding:20px;display:flex;flex-direction:column;gap:12px;"><div class="skeleton" style="height:20px;width:80%;border-radius:4px;"></div><div class="skeleton" style="height:14px;width:60%;border-radius:4px;"></div></div></div>
          <div class="tour-card"><div class="skeleton" style="height:220px;border-radius:var(--radius-lg) var(--radius-lg) 0 0;"></div><div style="padding:20px;display:flex;flex-direction:column;gap:12px;"><div class="skeleton" style="height:20px;width:80%;border-radius:4px;"></div><div class="skeleton" style="height:14px;width:60%;border-radius:4px;"></div></div></div>
        </div>
      </div>
    </section>

    <!-- CTA -->
    <section style="background:var(--primary);padding:64px 0;text-align:center;" aria-label="Chamada para acção">
      <div class="mb-container">
        <h2 style="font-size:clamp(1.5rem,3vw,2rem);font-weight:800;color:#fff;margin-bottom:12px;">Não encontrou o que procura?</h2>
        <p style="color:rgba(255,255,255,.75);margin-bottom:28px;font-size:1.0625rem;">Criamos experiências personalizadas para grupos, famílias e eventos empresariais.</p>
        <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center;">
          <a href="custom-tour.html" class="btn-primary-mb">
            <i class='bx bx-map-alt'></i>Pedir tour personalizado
          </a>
          <a href="../index.html#contact" class="btn-sea-green">
            <i class='bx bxl-whatsapp'></i>Falar connosco
          </a>
        </div>
      </div>
    </section>

  </main>

  <div id="footer-placeholder"></div>
  <button class="scroll-to-top" aria-label="Voltar ao topo"><i class='bx bx-chevron-up'></i></button>

  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script defer src="../assets/js/components.js"></script>
  <script defer src="../assets/js/data-loader.js"></script>
  <script defer src="../assets/js/slider.js"></script>
  <script defer src="../assets/js/main.js"></script>
  <script type="module" src="../assets/js/card-ratings.js"></script>


</body>
</html>
