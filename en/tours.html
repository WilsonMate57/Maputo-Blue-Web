  <meta name="robots" content="index, follow">

  <!-- hreflang -->
  <link rel="alternate" hreflang="pt" href="https://www.maputoblue.com/pages/tours.html">
  <link rel="alternate" hreflang="en" href="https://www.maputoblue.com/en/tours.html">
  <link rel="alternate" hreflang="x-default" href="https://www.maputoblue.com/pages/tours.html">

  <!-- Open Graph -->

  <meta property="og:image" content="../assets/images/hero/hero-4.webp">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="icon" type="image/png" href="../logo.webp">
</head>
<body>

  <!-- Preloader -->
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
  <div id="preloader" aria-hidden="true">
    <lottie-player src="../assets/preloader/boat steering.json" background="transparent" speed="1" loop autoplay></lottie-player>
  </div>
  <script>(function(){var t=Date.now();function hide(){document.getElementById('preloader').classList.add('hidden');}window.addEventListener('load',function(){var elapsed=Date.now()-t;var remaining=3000-elapsed;if(remaining<=0){hide();}else{setTimeout(hide,remaining);}});})();</script>

  <div id="navbar-placeholder"></div>

  <main class="tours-main">

    <!-- Page Hero -->
    <header class="page-hero" aria-labelledby="tours-page-title">
      <div class="mb-container">
        <div class="page-hero-content">
          <nav class="breadcrumb-mb" aria-label="Breadcrumb">
            <a href="index.html">Home</a>
            <span>/</span>
            <span>Day Tours</span>
          </nav>
          <h1 class="page-hero-title" id="tours-page-title">All Day Tours</h1>
          <p class="page-hero-subtitle">Choose the perfect experience — islands, beaches, safaris and much more</p>
        </div>
      </div>
    </header>

    <!-- Category Filters -->
    <div class="tours-filters" role="navigation" aria-label="Filter tours by category">
      <div class="mb-container">
        <div class="filter-row">
          <button class="filter-chip active" data-category="all">
            <i class='bx bx-grid-alt'></i> All
          </button>
          <button class="filter-chip" data-category="island-daytrips">
            <i class='bx bx-anchor'></i> Island DayTrips
          </button>
          <button class="filter-chip" data-category="beach-daytrips">
            <i class='bx bx-sun'></i> Sunset Cruises
          </button>
          <button class="filter-chip" data-category="safaris">
            <i class='bx bx-landscape'></i> Safaris
          </button>
          <button class="filter-chip" data-category="transfers">
            <i class='bx bx-car'></i> Transfers
          </button>
          <button class="filter-chip" data-category="maputo-city-tour">
            <i class='bx bx-building-house'></i> City Tours
          </button>
          <button class="filter-chip" data-category="whale-watching">
            <i class='bx bxs-binoculars'></i> Whale Watching
          </button>
          <button class="filter-chip" data-category="fishing-charters">
            <i class='bx bxs-ship'></i> Fishing Charters
          </button>
        </div>
      </div>
    </div>

    <!-- Tours Grid -->
    <section class="mb-section" style="background:var(--light-bg);" aria-label="Tours list">
      <div class="mb-container">
        <div class="tours-grid" id="tours-grid" aria-live="polite">
          <div class="tour-card"><div class="skeleton" style="height:220px;border-radius:var(--radius-lg) var(--radius-lg) 0 0;"></div><div style="padding:20px;display:flex;flex-direction:column;gap:12px;"><div class="skeleton" style="height:20px;width:80%;border-radius:4px;"></div><div class="skeleton" style="height:14px;width:60%;border-radius:4px;"></div></div></div>
          <div class="tour-card"><div class="skeleton" style="height:220px;border-radius:var(--radius-lg) var(--radius-lg) 0 0;"></div><div style="padding:20px;display:flex;flex-direction:column;gap:12px;"><div class="skeleton" style="height:20px;width:80%;border-radius:4px;"></div><div class="skeleton" style="height:14px;width:60%;border-radius:4px;"></div></div></div>
          <div class="tour-card"><div class="skeleton" style="height:220px;border-radius:var(--radius-lg) var(--radius-lg) 0 0;"></div><div style="padding:20px;display:flex;flex-direction:column;gap:12px;"><div class="skeleton" style="height:20px;width:80%;border-radius:4px;"></div><div class="skeleton" style="height:14px;width:60%;border-radius:4px;"></div></div></div>
        </div>
      </div>
    </section>

    <!-- CTA -->
    <section style="background:var(--primary);padding:64px 0;text-align:center;" aria-label="Call to action">
      <div class="mb-container">
        <h2 style="font-size:clamp(1.5rem,3vw,2rem);font-weight:800;color:#fff;margin-bottom:12px;">Didn't find what you're looking for?</h2>
        <p style="color:rgba(255,255,255,.75);margin-bottom:28px;font-size:1.0625rem;">We create personalised experiences for groups, families and corporate events.</p>
        <a href="index.html#contact" class="btn-sea-green">
          <i class='bx bxl-whatsapp'></i>Talk to us
        </a>
      </div>
    </section>

  </main>

  <div id="footer-placeholder"></div>
  <button class="scroll-to-top" aria-label="Back to top"><i class='bx bx-chevron-up'></i></button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/data-loader.js"></script>
  <script src="../assets/js/slider.js"></script>
  <script src="../assets/js/main.js"></script>
  <script type="module" src="../assets/js/card-ratings.js"></script>

  <!-- Auto-apply category filter from URL param -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const CATEGORY_COPY = {
        all: {
          crumb: 'Day Tours',
          title: 'All Day Tours',
          subtitle: 'Choose the perfect experience — islands, beaches, safaris and much more',
          docTitle: 'Day Tours | Maputo Blue — Experiences in Mozambique'
        },
        'island-daytrips': {
          crumb: 'Island DayTrips',
          title: 'Island DayTrips',
          subtitle: 'Island trips to Inhaca, Santa Maria and Portuguese Island',
          docTitle: 'Island DayTrips | Maputo Blue'
        },
        'beach-daytrips': {
          crumb: 'Sunset Cruises',
          title: 'Sunset Cruises',
          subtitle: 'Sunset cruises on Maputo Bay',
          docTitle: 'Sunset Cruises | Maputo Blue'
        },
        safaris: {
          crumb: 'Safaris',
          title: 'Safaris',
          subtitle: 'Safari and nature excursions from Maputo',
          docTitle: 'Safaris | Maputo Blue'
        },
        transfers: {
          crumb: 'Transfers',
          title: 'Transfers',
          subtitle: 'Car and boat transfers departing from Maputo',
          docTitle: 'Transfers | Maputo Blue'
        },
        'maputo-city-tour': {
          crumb: 'City Tours',
          title: 'City Tours',
          subtitle: 'Cultural and historical tours through Maputo city',
          docTitle: 'City Tours | Maputo Blue'
        },
        'whale-watching': {
          crumb: 'Whale Watching',
          title: 'Whale Watching',
          subtitle: 'Whale watching experiences during the right season',
          docTitle: 'Whale Watching | Maputo Blue'
        },
        'fishing-charters': {
          crumb: 'Fishing Charters',
          title: 'Fishing Charters',
          subtitle: 'Private deep-sea fishing trips',
          docTitle: 'Fishing Charters | Maputo Blue'
        }
      };
      function syncHero(cat) {
        const copy = CATEGORY_COPY[cat] || CATEGORY_COPY.all;
        const crumb = document.querySelector('.breadcrumb-mb span:last-child');
        const title = document.getElementById('tours-page-title');
        const subtitle = document.querySelector('.page-hero-subtitle');
        if (crumb) crumb.textContent = copy.crumb;
        if (title) title.textContent = copy.title;
        if (subtitle) subtitle.textContent = copy.subtitle;
        document.title = copy.docTitle;
      }
      document.querySelectorAll('.filter-chip[data-category]').forEach(chip => {
        chip.addEventListener('click', () => syncHero(chip.dataset.category));
      });
      const params = new URLSearchParams(window.location.search);
      const cat = params.get('category');
      syncHero(cat || 'all');
      if (!cat) return;
      const chip = document.querySelector(`.filter-chip[data-category="${cat}"]`);
      if (chip) setTimeout(() => chip.click(), 400);
    });
  </script>

</body>
</html>
